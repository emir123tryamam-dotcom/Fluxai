      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          base64 -d "$RUNNER_TEMP/fluxai-project.b64" > "$RUNNER_TEMP/fluxai-project.zip"
          mkdir -p "$RUNNER_TEMP/fluxai-src"
          unzip -q "$RUNNER_TEMP/fluxai-project.zip" -d "$RUNNER_TEMP/fluxai-src"
          test -f "$RUNNER_TEMP/fluxai-src/FluxAI/app/build.gradle.kts"
          echo "PROJECT_DIR=$RUNNER_TEMP/fluxai-src/FluxAI" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          echo "sdkmanager: $SDKM"
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null || true
          set -o pipefail
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GROQ_API_KEY:-}" ]; then
            gradle --no-daemon --stacktrace :app:assembleDebug -PGROQ_API_KEY="$GROQ_API_KEY"
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/release/FluxAI-2.0.apk"
          test -s "$GITHUB_WORKSPACE/release/FluxAI-2.0.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxAI-2.0-APK
          path: release/FluxAI-2.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FluxAI-build-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports
          if-no-files-found: ignore
          retention-days: 7
