name: FluxAI 2.0 - Single YAML APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: fluxai-single-yaml-${{ github.ref }}
  cancel-in-progress: true

